<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kyowewet - Spider City 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial;color:white;touch-action:none}
canvas{display:block}
#info{position:absolute;top:10px;left:10px;background:#111c;padding:10px;border-radius:10px;line-height:1.5}
#msg{position:absolute;top:105px;left:50%;transform:translateX(-50%);background:#111c;padding:8px;border-radius:8px;white-space:nowrap}
#controls{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:10px;gap:8px}
.pad{display:grid;grid-template-columns:46px 46px 46px;grid-template-rows:46px 46px;gap:4px}
button{background:#222c;color:white;border:1px solid #ffffff88;border-radius:12px;font-weight:bold;font-size:15px;touch-action:none}
#up{grid-column:2}#left{grid-column:1;grid-row:2}
#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}
.actions{display:flex;flex-direction:column;gap:6px}
.actions button{width:82px;height:39px}
</style>
</head>
<body>
<div id="info">
<b>SPIDER CITY 3D</b><br>
🕷️ Kyowewet<br>
<small id="mode">Mode: Jalan kaki</small><br>
<small id="pos">Open World</small>
</div>
<div id="msg">Selamat datang, Kyowewet!</div>
<div id="controls">
<div class="pad">
<button id="up">▲</button>
<button id="left">◀</button>
<button id="down">▼</button>
<button id="right">▶</button>
</div>
<div class="actions">
<button id="jump">LOMPAT</button>
<button id="run">LARI</button>
<button id="web">🕸 JARING</button>
<button id="carbtn">MOBIL</button>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
if(!window.THREE){
 document.getElementById('msg').textContent='Internet diperlukan untuk grafik 3D.';
 throw Error('Three.js belum dimuat');
}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8bd5ff);
scene.fog=new THREE.Fog(0x8bd5ff,55,160);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,400);
const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.4));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x65745a,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(25,50,15);
scene.add(sun);

function mat(c){return new THREE.MeshLambertMaterial({color:c})}
function cube(parent,x,y,z,w,h,d,c){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));
 m.position.set(x,y,z);
 parent.add(m);
 return m;
}

// Dunia kota
cube(scene,0,-.35,0,220,.5,220,0x68a95a);
for(let x=-100;x<=100;x+=30){
 cube(scene,x,.01,0,8,.08,220,0x45494c);
 cube(scene,x-5,.06,0,.12,.03,220,0xffffff);
}
for(let z=-100;z<=100;z+=30){
 cube(scene,0,.02,z,220,.08,8,0x45494c);
 cube(scene,0,.07,z-5,220,.03,.12,0xffffff);
}

// Gedung yang bisa dijadikan sasaran jaring
const buildings=[];
for(let x=-90;x<=90;x+=15){
 for(let z=-90;z<=90;z+=15){
  if(x%30===0||z%30===0)continue;
  const h=5+Math.random()*13;
  const b=cube(scene,x,h/2,z,7,h,7,
    [0xc5c8d0,0xd8b795,0x9cabbc,0xd5d2c9][Math.floor(Math.random()*4)]);
  buildings.push({x:x,z:z,h:h,mesh:b});
  for(let y=2;y<h-1;y+=2){
   for(const s of [-1,1]){
    cube(scene,x+s*3.53,y,z,.04,.7,1,0x83d9ed);
   }
  }
 }
}

// Karakter cewek Kyowewet
const player=new THREE.Group();
scene.add(player);

function ball(p,x,y,z,r,c){
 const m=new THREE.Mesh(new THREE.SphereGeometry(r,10,8),mat(c));
 m.position.set(x,y,z);p.add(m);return m;
}
function limb(p,a,b,r,c){
 const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b);
 const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,A.distanceTo(B),7),mat(c));
 m.position.copy(A).add(B).multiplyScalar(.5);
 m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),B.clone().sub(A).normalize());
 p.add(m);return m;
}

ball(player,0,2.05,0,.34,0xffd1a4); // kepala
limb(player,[0,1.7,0],[0,1.05,0],.13,0xe84393); // badan
limb(player,[0,1.05,0],[-.18,.45,0],.09,0x29263c);
limb(player,[0,1.05,0],[.18,.45,0],.09,0x29263c);
limb(player,[0,1.55,0],[-.4,1.15,0],.07,0xffd1a4);
limb(player,[0,1.55,0],[.4,1.15,0],.07,0xffd1a4);

// Rambut
ball(player,0,2.2,.08,.37,0x29202b);
ball(player,0,2.32,-.2,.25,0x29202b);
ball(player,-.28,1.95,.05,.12,0x29202b);
ball(player,.28,1.95,.05,.12,0x29202b);

// Nametag
const nc=document.createElement('canvas');
nc.width=512;nc.height=128;
const ctx=nc.getContext('2d');
ctx.fillStyle='#111d';ctx.fillRect(5,5,502,118);
ctx.font='bold 58px Arial';ctx.textAlign='center';
ctx.fillStyle='#ff9fd0';ctx.fillText('Kyowewet',256,82);
const tag=new THREE.Sprite(new THREE.SpriteMaterial({
 map:new THREE.CanvasTexture(nc),transparent:true
}));
tag.scale.set(3,0.75,1);
tag.position.set(0,3,0);
player.add(tag);

// Mobil
const car=new THREE.Group();
scene.add(car);
cube(car,0,.8,0,2.2,.8,4,0xd93232);
cube(car,0,1.45,-.2,1.5,.65,1.8,0xe8f5ff);
for(const x of [-1,1]){
 for(const z of [-1.3,1.3]){
  const w=new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,.2,10),mat(0x202020));
  w.rotation.z=Math.PI/2;w.position.set(x,.4,z);car.add(w);
 }
}
car.position.set(4,0,0);

// Kontrol
const keys={up:false,down:false,left:false,right:false};
let angle=0,driving=false,running=false,vy=0,onGround=true;
let webActive=false,webAnchor=null,webLine=null;
const msg=document.getElementById('msg');

function bind(id,k){
 const b=document.getElementById(id);
 b.addEventListener('pointerdown',e=>{
  e.preventDefault();keys[k]=true;
  b.setPointerCapture(e.pointerId);
 });
 for(const ev of ['pointerup','pointercancel','lostpointercapture']){
  b.addEventListener(ev,()=>keys[k]=false);
 }
}
bind('up','up');bind('down','down');
bind('left','left');bind('right','right');

const runBtn=document.getElementById('run');
runBtn.addEventListener('pointerdown',()=>running=true);
for(const ev of ['pointerup','pointercancel','lostpointercapture']){
 runBtn.addEventListener(ev,()=>running=false);
}

document.getElementById('jump').addEventListener('pointerdown',()=>{
 if(onGround&&!driving){vy=8;onGround=false}
});

// Cari titik gedung di arah pandang karakter
function findAnchor(){
 const origin=new THREE.Vector3(player.position.x,player.position.y+1.5,player.position.z);
 const dir=new THREE.Vector3(-Math.sin(angle),0,-Math.cos(angle));
 let best=null,bestDist=35;

 for(const b of buildings){
  const dx=b.x-origin.x,dz=b.z-origin.z;
  const forward=dx*dir.x+dz*dir.z;
  const side=Math.abs(dx*dir.z-dz*dir.x);
  const dist=Math.hypot(dx,dz);
  if(forward>2&&side<Math.max(3,forward*.24)&&dist<bestDist){
   bestDist=dist;
   best=new THREE.Vector3(b.x,b.h,b.z);
  }
 }
 return best;
}

document.getElementById('web').addEventListener('pointerdown',()=>{
 if(driving)return;

 if(webActive){
  webActive=false;webAnchor=null;
  if(webLine){scene.remove(webLine);webLine=null}
  msg.textContent='Jaring dilepas!';
  return;
 }

 webAnchor=findAnchor();
 if(!webAnchor){
  msg.textContent='Arahkan ke gedung yang dekat!';
  return;
 }

 const start=player.position.clone().add(new THREE.Vector3(0,1.5,0));
 webLine=new THREE.Line(
  new THREE.BufferGeometry().setFromPoints([start,webAnchor]),
  new THREE.LineBasicMaterial({color:0xffffff})
 );
 scene.add(webLine);
 webActive=true;
 msg.textContent='Kyowewet menembakkan jaring!';
});

// Mobil
document.getElementById('carbtn').addEventListener('pointerdown',()=>{
 if(!driving&&player.position.distanceTo(car.position)<5){
  driving=true;player.visible=false;
  webActive=false;
  if(webLine){scene.remove(webLine);webLine=null}
  msg.textContent='Kyowewet masuk mobil!';
 }else if(driving){
  driving=false;player.visible=true;
  player.position.copy(car.position);
  player.position.x+=2.5;
  msg.textContent='Kyowewet keluar mobil!';
 }else{
  msg.textContent='Dekati mobil untuk masuk!';
 }
 document.getElementById('mode').textContent=driving?'Mengemudi':'Jalan kaki';
});

const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 const target=driving?car:player;
 const speed=driving?13:(running?9:5);

 if(keys.left)angle+=2*dt;
 if(keys.right)angle-=2*dt;
 const f=(keys.up?1:0)-(keys.down?1:0);
 if(f){
  target.position.x-=Math.sin(angle)*f*speed*dt;
  target.position.z-=Math.cos(angle)*f*speed*dt;
 }

 target.position.x=THREE.MathUtils.clamp(target.position.x,-100,100);
 target.position.z=THREE.MathUtils.clamp(target.position.z,-100,100);

 if(!driving){
  vy-=18*dt;
  player.position.y+=vy*dt;
  if(player.position.y<=0){
   player.position.y=0;vy=0;onGround=true;
  }
  player.rotation.y=angle;
 }

 if(driving)car.rotation.y=angle;

 // Jaring menarik karakter menuju gedung
 if(webActive&&webAnchor&&!driving){
  const start=player.position.clone();
  start.y+=1.5;
  const delta=webAnchor.clone().sub(start);
  const distance=delta.length();

  if(distance>1.7){
   delta.normalize();
   player.position.addScaledVector(delta,Math.min(14*dt,distance-1.7));
   vy=0;
   onGround=false;
  }else{
   webActive=false;
   webAnchor=null;
   if(webLine){scene.remove(webLine);webLine=null}
   msg.textContent='Kyowewet mencapai gedung!';
  }

  if(webLine&&webAnchor){
   webLine.geometry.setFromPoints([start,webAnchor]);
  }
 }

 const behind=driving?9:7;
 const height=driving?5:4;
 const desired=new THREE.Vector3(
  target.position.x+Math.sin(angle)*behind,
  target.position.y+height,
  target.position.z+Math.cos(angle)*behind
 );
 camera.position.lerp(desired,1-Math.exp(-5*dt));
 camera.lookAt(target.position.x,target.position.y+1,target.position.z);

 document.getElementById('pos').textContent=
  'X: '+target.position.x.toFixed(0)+' Z: '+target.position.z.toFixed(0);
 renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
  </html>
